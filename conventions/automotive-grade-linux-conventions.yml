  lifecycle: lifecycle/automotive-grade-linux-lifecycle.yml
  authentication: authentication/automotive-grade-linux-authentication.yml
  rate_limits: rate-limits/automotive-grade-linux-rate-limits.yml
  mcp: mcp/automotive-grade-linux-mcp.yml
