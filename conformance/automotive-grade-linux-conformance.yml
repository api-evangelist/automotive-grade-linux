domain_standard:
  market: automotive / software-defined vehicle
  declared_in_contract: false
  detail: >-
    AGL's market has real standards - SOME/IP, COVESA VSS, AUTOSAR, ISO 26262 - and AGL participates
    in several, but none of them is declared inside a machine-readable contract served from an AGL
    host. The two contracts AGL does serve describe a website event calendar, whose market standard
    would be iCalendar/schema.org Event, and they declare neither. Recorded as absent rather than
    inferred from prose; this is reward-only and nothing is deducted for it.
