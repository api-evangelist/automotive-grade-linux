models:
- id: events
  base: https://www.automotivelinux.org/wp-json/tribe/events/v1/
  spec: openapi/automotive-grade-linux-events-api-openapi.json
  entities:
  - name: Event
    id_field: id
    also: global_id (globally unique across federated sites), global_id_lineage[]
    key_fields: [title, slug, status, start_date, end_date, utc_start_date, utc_end_date, timezone, all_day, cost, featured, sticky, hide_from_listings, url, rest_url]
    note: >-
      Dates are carried twice - as a string and as a structured DateDetails object
      (year/month/day/hour/minutes/seconds) - in both local and UTC form, four DateDetails refs per event.
  - name: Venue
    id_field: id
    key_fields: [venue, slug, address, city, state, stateprovince, province, zip, country, geo_lat, geo_lng, phone, website, show_map, show_map_link]
  - name: Organizer
    id_field: id
    key_fields: [organizer, slug, phone, website, email]
  - name: Term
    id_field: id
    key_fields: [name, slug, taxonomy, description, parent, count, url, urls]
    note: one shape serves both event categories (tribe_events_cat) and tags
  - name: Image
    id_field: id
    key_fields: [url, extension, width, height, sizes]
  - name: ImageSize
    key_fields: [width, height, mime-type, url]
  - name: DateDetails
    key_fields: [year, month, day, hour, minutes, seconds]
  - name: CostDetails
    key_fields: [currency_symbol, currency_position, values]
  - name: Series
    source: tec/v1 only (GET /series, tagged "Events Pro")
    note: recurring-event series; present in the newer namespace only
  relationships:
