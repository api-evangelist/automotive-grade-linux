  - from: Event
    to: CostDetails
    type: has_one
    via: cost_details
  - from: Venue
    to: Image
    type: has_one
    via: image
  - from: Organizer
    to: Image
    type: has_one
    via: image
  - from: Image
    to: ImageSize
    type: has_many
