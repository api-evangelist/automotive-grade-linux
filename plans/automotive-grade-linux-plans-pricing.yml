description: >-
  Automotive Grade Linux publishes no API plans and no API pricing, because it sells no API. AGL is a
  Linux Foundation collaborative project: the software (meta-agl, the agl-service-* bindings, the SoDeV
  reference platform, lava-mcp-toolkit) is free and open source, and the two callable HTTP surfaces
  found in this profile - the public event calendar at www.automotivelinux.org/wp-json/ and the LAVA
  test lab at lava.automotivelinux.org - are community infrastructure offered without a commercial tier.
plans: []
membership:
  note: >-
    AGL has corporate membership, which is the only thing resembling a commercial tier, and it is NOT
    an API plan. The Join page publishes no fee schedule and no membership levels with prices - it
    describes member benefits (the All Member Meeting, the AGL booth at CES and Embedded World, a
    Vendor Marketplace listing) and ends in a contact form. Individuals are directed to the
    documentation instead of to any paid tier.
  url: https://www.automotivelinux.org/about/join-2/
  status: 200
  published_price: false
  named_levels: [Advisory Board, Steering Committee]
  named_levels_note: >-
    Read from the site's own members_category taxonomy in /llms.txt; these are governance bodies
    listed on the site, not priced membership SKUs.
x-superseded:
  date: '2026-09-14'
  detail: >-
    This file previously contained a three-tier Free/Professional/Enterprise scaffold with invented
    request quotas (1,000/month free, 100,000/month professional), invented per-minute rate limits and
    "TBD" prices, written by a bulk sweep dated 2026-05-04 and never harvested from AGL. None of it
    was real. It has been replaced with the measured result: there are no plans.
