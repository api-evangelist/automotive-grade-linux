problem_types:
- id: rest_no_route
  surface: events
  status: 404
  title: No route was found matching the URL and request method
  observed_at: https://www.automotivelinux.org/wp-json/wp/v2/posts
  remediation: >-
    The route is not mounted. On this host every wp/v2 route is disabled even though /wp-json/ lists
    the namespace - use tribe/events/v1 or tec/v1 instead.
- id: rest_forbidden
  surface: events
  status: 401
  title: Sorry, you are not allowed to do that
  observed_at: https://www.automotivelinux.org/wp-json/wp-abilities/v1/abilities
  remediation: Authenticate with WordPress Application Passwords over HTTP Basic; the Abilities API is not anonymous.
- id: events-400
  surface: events
  status: 400
  title: Invalid request
  source_operations: [getEvents, createEvent, updateEvent, getOrganizers, getVenues, getSeries]
  remediation: A query parameter or request body field failed validation; correct it and retry.
- id: events-401
  surface: events
  status: 401
  title: You are not logged in
  source_operations: [createEvent, updateEvent, deleteEvent, createVenue, updateVenue, deleteVenue, createOrganizer, updateOrganizer, deleteOrganizer]
  remediation: Supply HTTP Basic credentials (WordPress Application Password). All writes are authenticated.
- id: events-403
  surface: events
  status: 403
  title: You do not have permission to perform this action on this object
  source_operations: [createEvent, updateEvent, deleteEvent, getEvent (by id/slug), createVenue, updateVenue, deleteVenue, createOrganizer, updateOrganizer, deleteOrganizer]
  remediation: The credential authenticated but lacks the capability for this object. Not retryable.
- id: events-404
  surface: events
  status: 404
  title: The requested resource was not found
  source_operations: [getEvents, getEvent, getVenues, getVenue, getOrganizers, getOrganizer, getSeries]
  remediation: Wrong id or slug, or the object is not published.
- id: events-410
  surface: events
  status: 410
  title: The object has already been trashed
  source_operations: [deleteEvent, deleteVenue, deleteOrganizer]
  remediation: >-
    A prior DELETE already soft-deleted this object. Pass force=true to bypass Trash and delete
    permanently - that is irreversible over the API.
- id: events-501
  surface: events
  status: 501
  title: The object does not support trashing; set force=true to delete
  source_operations: [deleteEvent, deleteVenue, deleteOrganizer]
  remediation: Retry the DELETE with force=true, understanding it is permanent.
- id: events-500
  surface: events
  status: 500
  title: Failed to complete the operation
  source_operations: [createEvent, updateEvent, deleteEvent, createVenue, updateVenue, deleteVenue, createOrganizer, updateOrganizer, deleteOrganizer]
  remediation: Server-side failure; retry with backoff. No idempotency key exists, so verify state before retrying a create.
- id: lava-401-403
  surface: lava
  status: [401, 403]
  title: Bad or missing token, OR insufficient permission on the object
  source: skills/automotive-grade-linux-lava-skill.md
  remediation: >-
    AGL states explicitly that this is "not just an auth bug" - LAVA has per-device and
    per-devicetype submit permissions, so a valid token can still be refused for a specific device.
    Check the permission, not only the credential.
- id: lava-404-job
  surface: lava
  status: 404
  title: Wrong job id, or no view permission on that job
  source: skills/automotive-grade-linux-lava-skill.md
  remediation: A 404 here does not prove the job is absent - it may exist and be invisible to this identity.
- id: lava-400-submit
  surface: lava
  status: 400
  title: Job definition failed schema or device-compatibility validation
  source: skills/automotive-grade-linux-lava-skill.md
  remediation: >-
    The body carries the validation error. AGL's instruction to agents is to surface it verbatim to
    the user and not guess at a fix.
