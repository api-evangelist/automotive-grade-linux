method: derived
source: >-
  mcp/automotive-grade-linux-mcp.yml bound against the REST calls in
  https://raw.githubusercontent.com/automotive-grade-linux/lava-mcp-toolkit/main/python/stdio/tools.py
  and the endpoint table AGL publishes in skills/automotive-grade-linux-lava-skill.md
note: >-
  AGL's MCP tools front the LAVA REST API v0.2, for which AGL publishes NO OpenAPI - the DRF root at
  /api/v0.2/ enumerates collections but serves no schema, and /api/v0.2/?format=openapi, /schema/ and
  /swagger/ all 404. So `rest:` rows name METHOD + path rather than an operationId. Those bindings are
  not inferred from prose: the call_tool dispatch in tools.py performs each request literally, so the
  method/path pairs below are read from executable source. The two OpenAPIs in openapi/ describe a
  different surface entirely (the AGL website's public events API), and share no operations with these
  tools - that divergence is recorded in rest_only[] rather than force-mapped.
surfaces:
  openapi:
  - file: openapi/automotive-grade-linux-events-api-openapi.json
    base: https://www.automotivelinux.org/wp-json/tribe/events/v1/
    gated: false
    note: unrelated to the MCP tool set - the public AGL events API, read-anonymous
  - file: openapi/automotive-grade-linux-events-tec-v1-openapi.json
    base: https://www.automotivelinux.org/wp-json/tec/v1
    gated: partial
    note: reads anonymous, writes require WordPress Application Passwords (HTTP Basic)
  rest:
    name: AGL LAVA REST API v0.2
    base: https://lava.automotivelinux.org/api/v0.2/
    spec: none published
    gated: partial
    note: >-
      GET on jobs/, devices/, devicetypes/, workers/, tags/, aliases/ answers anonymously
      (verified 2026-09-14); submit/cancel and most writes require a LAVA token.
  graphql: none
  mcp:
    transport: [stdio, http]
    hosted_endpoint: none
    gated: true
    note: consumer-run; requires a LAVA token supplied out of band
