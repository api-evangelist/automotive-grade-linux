  2026-09-14; the only first-party client code found is lava-mcp-toolkit, distributed from source.
summary: >-
  AGL publishes no client SDK on any public package registry. It does publish first-party API client
  code: lava-mcp-toolkit ships four complete implementations of a LAVA REST client (Go, Python, Rust,
  C++) under Apache-2.0, each usable as an MCP server or as a library. Distribution is git-clone only -
  there is no npm, PyPI, crates.io, NuGet, Maven or RubyGems artifact, and the Go modules declare local
  module paths (`lava-mcp-server`, `lava-mcp-stdio`) rather than a github.com/... path, so `go get`
  does not resolve them either. AGL's own platform code (meta-agl, the agl-service-* bindings) ships as
  Yocto/OpenEmbedded layers and BitBake recipes, which are not language package registries.
