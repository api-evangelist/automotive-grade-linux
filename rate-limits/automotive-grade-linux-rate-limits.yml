limit_count: 0
description: >-
  No rate limits are published and none are signalled at runtime. Neither surface returned a
  RateLimit-*, X-RateLimit-* or Retry-After header on an anonymous 200, neither OpenAPI declares a 429
  response on any of its 47 operations, and AGL's own LAVA API reference - which documents auth,
  pagination, filtering and error conventions in detail - says nothing about throttling. An agent
  integrating here has no runtime signal to back off on and must self-govern.
