        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        example: 1
      - name: per_page
        in: query
        description: Maximum number of items to be returned in result set.
        required: false
        schema:
          type: integer
          default: 10
          maximum: 100
          minimum: 1
        example: 51
      - name: search
        in: query
        description: Limit results to those matching a string.
        required: false
        schema:
          type: string
        example: Example
      - name: event
        in: query
        description: Limit result set to venues with specific event.
        required: false
        schema:
          type: integer
        example: 126
      - name: has_events
        in: query
        description: Limit result set to venues with events.
        required: false
        schema:
          type: boolean
        example: true
      - name: only_with_upcoming
        in: query
        description: Limit result set to venues with upcoming events.
        required: false
        schema:
          type: boolean
        example: true
      - name: status
        in: query
        description: Limit result set to venues with specific status.
        required: false
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - publish
            - pending
            - draft
            - future
            - private
          default:
          - publish
          uniqueItems: true
        example:
        - publish
      - name: geoloc_lat
        in: query
        description: The latitude of the venue
        required: false
        schema:
          type: number
        example: 37.774929
      - name: geoloc_lng
        in: query
        description: The longitude of the venue
        required: false
        schema:
          type: number
        example: -122.419416
      - name: distance
        in: query
        description: The distance of the venues relative to the geolocation
        required: false
        schema:
          type: number
        example: 10
      - name: has_geoloc
        in: query
        description: Filter by venues that have geolocation data
        required: false
        schema:
          type: boolean
        example: true
      - name: near
        in: query
        description: Filter by venues near an address
        required: false
        schema:
          type: string
        example: San Francisco, CA
      responses:
        '200':
          description: Returns the list of venues
          headers:
            X-WP-Total:
              description: The total number of venues matching the request.
              required: true
              schema:
                type: integer
            X-WP-TotalPages:
              description: The total number of pages for the request.
              required: true
              schema:
                type: integer
            Link:
              description: "RFC 5988 Link header for pagination. Contains navigation links with relationships:\n\t\t\t\t`rel=\"next\"` for the next page (if not on last page),\n\t\t\t\t`rel=\"prev\"` for the previous page (if not on first page).\n\t\t\t\tHeader is omitted entirely if there's only one page"
              required: false
              schema:
                type: array
                items:
                  type: string
                  format: uri
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Venue_2'
        '400':
          description: A required parameter is missing or an input parameter is in the wrong format
        '404':
          description: The requested page was not found
    post:
